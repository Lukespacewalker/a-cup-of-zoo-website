name: Check and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run prepare:assets
      - run: bun run format:check
      - run: bun run check
      - run: bun run test:unit
      - run: bun run verify:content
      - run: bunx playwright install --with-deps chromium
      - name: Browser tests with local fixtures
        run: |
          trap 'rm -f .dev.vars' EXIT
          cat > .dev.vars <<'VARS'
          SITE_ENV=local
          CONTENT_MODE=fixture
          CMS_BASE_URL=http://127.0.0.1:1
          SEARCH_INDEXING=disabled
          VARS
          bun run test:e2e --workers=2
      - run: bun run build
      - run: bunx wrangler deploy --dry-run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    needs: check
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://acupofzoo.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Deploy website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 033dbd2d33d8bb93fcc2930c22752d8a
        run: bunx wrangler deploy --tag "${GITHUB_SHA::7}" --message "GitHub Actions ${GITHUB_SHA}"
      - name: Check public domains
        run: |
          curl --fail --silent --show-error --output /dev/null https://acupofzoo.com/
          curl --fail --silent --show-error --output /dev/null https://www.acupofzoo.com/en/animals/
